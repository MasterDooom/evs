<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVS CAT-II — Study Desk</title>
  <meta name="description" content="Focused EVS CAT-II revision notes, diagrams, tables, flashcards and MCQs." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">EVS</div>
        <div><strong>CAT-II</strong><span>Study Desk</span></div>
      </div>

      <div class="exam-card">
        <div class="eyebrow">REVISION PROGRESS</div>
        <div class="progress-row"><span id="progressLabel">0% revised</span><span id="progressCount">0/26</span></div>
        <div class="progress"><i id="progressBar"></i></div>
      </div>

      <nav id="topicNav"></nav>

      <div class="sidebar-actions">
        <button class="sidebar-btn" id="practiceBtn">Test · 30 MCQs</button>
        <button class="sidebar-btn secondary-sidebar" id="flashBtn">Flashcards</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open topic menu" aria-expanded="false">☰</button>
        <div class="top-title"><span>ENVIRONMENTAL SCIENCE</span><strong>CAT-II Revision</strong></div>
        <div class="search-wrap">
          <span>⌕</span><input id="search" placeholder="Search topics, definitions, Acts, numbers…" />
          <kbd>Ctrl K</kbd>
        </div>
        <button class="ghost-btn" id="reviewBtn">Back to notes</button>
      </header>

      <div class="study-toolbar">
        <div class="toolbar-left">
          <span class="mode-dot"></span>
          <span>Focused study</span>
          <span class="toolbar-sep">/</span>
          <span>26 topics · 63 questions</span>
        </div>
        <div class="toolbar-actions">
          <button class="secondary" id="startBtn">Start from beginning</button>
          <button class="secondary" id="randomBtn">Random topic</button>
        </div>
      </div>

      <section id="content" class="content"></section>
      <section id="practice" class="practice hidden"></section>

      <footer>EVS CAT-II · built from the supplied course material</footer>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
