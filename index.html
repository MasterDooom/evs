<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVS CAT-II — Revision Workspace</title>
  <meta name="description" content="EVS CAT-II revision workspace with detailed notes, diagrams, tables, flashcards and MCQs." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <button class="brand" id="brandHome" aria-label="Back to course overview">
        <div class="brand-mark">EVS</div>
        <div><strong>CAT-II</strong><span>Revision Workspace</span></div>
      </button>

      <button class="course-home" id="homeBtn">
        <span class="home-icon">⌂</span>
        <span><strong>Course overview</strong><small>26 topics · 63 questions</small></span>
      </button>

      <div class="side-search">
        <span>⌕</span>
        <input id="sideSearch" placeholder="Find a topic…" />
      </div>

      <div class="side-progress">
        <div><span>REVISED</span><strong id="progressLabel">0%</strong></div>
        <div class="progress"><i id="progressBar"></i></div>
        <small id="progressCount">0 / 26 topics</small>
      </div>

      <nav id="topicNav"></nav>

      <div class="sidebar-actions">
        <button class="sidebar-btn" id="practiceBtn">Test · 30 MCQs</button>
        <button class="sidebar-btn secondary-sidebar" id="flashBtn">Flashcards</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open topic menu" aria-expanded="false">☰</button>
        <div class="crumb"><span>EVS</span><b>/</b><strong id="crumbCurrent">Course overview</strong></div>
        <div class="mode-switch">
          <button class="mode active" id="notesMode">Notes</button>
          <button class="mode" id="flashMode">Flashcards</button>
          <button class="mode" id="testMode">Test</button>
        </div>
        <div class="top-search">
          <span>⌕</span><input id="search" placeholder="Search notes, Acts, definitions…" /><kbd>Ctrl K</kbd>
        </div>
      </header>

      <div class="focusbar">
        <div><span class="live-dot"></span><span>Focused study</span><span class="divider">/</span><span id="topicMeta">Choose a topic to begin</span></div>
        <div class="focus-actions">
          <button class="tiny-btn" id="prevBtn">← Previous</button>
          <button class="tiny-btn" id="nextBtn">Next →</button>
          <button class="tiny-btn" id="focusBtn">Focus mode</button>
        </div>
      </div>

      <section id="content" class="content"></section>
      <section id="practice" class="practice hidden"></section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
